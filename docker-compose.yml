version: '3.8'

services:
  het-control:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./database:/app/database
      - ./.env:/app/.env
    environment:
      - HET_ENVIRONMENT=production
      - HET_API_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from app.config.settings import get_config; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (uncomment to use instead of SQLite)
  # postgres:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: het_control
  #     POSTGRES_USER: het_user
  #     POSTGRES_PASSWORD: het_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  postgres_data: